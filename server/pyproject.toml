[project]
name = "ludovitae"
version = "1.2.0"
description = "Game of Life — personal financial life simulator (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "cryptography>=42.0",
]

[project.scripts]
gol-seed = "gol.seed:main"
gol-serve = "gol.serve:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gol"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
